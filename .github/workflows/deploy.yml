name: Build and Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # GitHubの画面から手動実行もできる

permissions:
  id-token: write      # Azure OIDCログインに必要
  contents: read
  packages: write      # ghcr.io へのイメージ登録に必要

env:
  IMAGE_NAME: ghcr.io/m67pg/machine-tool-rental-ca   # ghcr.io のイメージ名は小文字のみ
  RESOURCE_GROUP: rg-machine-tool-rental
  CONTAINER_APP: machine-tool-rental-ca

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image to ghcr.io
        run: |
          IMAGE="$IMAGE_NAME:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy new revision to Container Apps
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_NAME:${{ github.sha }}"
